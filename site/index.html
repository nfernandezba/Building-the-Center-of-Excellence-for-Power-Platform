<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Books, white papers and solutions by Nicolás Fernández on Power Platform, Copilot Studio and Centers of Excellence.">
  <meta property="og:title" content="NFBA Knowledge Library">
  <meta property="og:description" content="Books, white papers and solutions by Nicolás Fernández on Power Platform, Copilot Studio and Centers of Excellence.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://nfernandezba.github.io/Building-the-Center-of-Excellence-for-Power-Platform/assets/og.webp">
  <meta name="twitter:card" content="summary_large_image">
  <title>NFBA Knowledge Library</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="library-app">
    <header class="nfba-header">
      <a class="nfba-mark" href="#library" aria-label="NFBA Knowledge Library home">
        <svg class="nfba-logo" viewBox="0 0 375 375" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NFBA logo">
          <path d="M187.508 68.336v65.129L238.699 83.3V18.19z" fill="#287ee1"/><path d="M136.313 18.191v65.11l51.195 50.164v-65.13z" fill="#3895ff"/><path d="m136.313 18.191 51.195 50.145 51.191-50.145z" fill="#64acff"/>
          <path d="M187.484 306.625v-65.129l-51.191 50.164v65.11z" fill="#14848f"/><path d="M238.68 356.77v-65.11l-51.196-50.164v65.129z" fill="#27b8c6"/><path d="m238.68 356.77-51.196-50.145-51.191 50.145z" fill="#43d1df"/>
          <path d="M303.828 187.95H238.7l50.168 51.195h65.11z" fill="#ffc000"/><path d="M353.977 136.758h-65.11L238.7 187.949h65.13z" fill="#826200"/><path d="m353.977 136.758-50.149 51.191 50.149 51.196z" fill="#ffd452"/>
          <path d="M71.164 187.012h65.129l-50.168-51.196h-65.11z" fill="#742774"/><path d="M21.016 238.203h65.109l50.168-51.191H71.164z" fill="#bd47bd"/><path d="m21.016 238.203 50.148-51.191-50.148-51.196z" fill="#d671d6"/>
          <path d="M164 145l23.5 22.5L210 145l21 20-22.5 22.5L231 209l-20.5 21-23-22-22 23-21-20.5 22.5-23-23-22z" fill="#5552b4"/>
        </svg>
      </a>
      <div class="header-title"><p>NFBA · Center of Excellence</p><h1>Knowledge Library</h1><span>Books, white papers and solutions by Nicolás Fernández</span></div>
      <div class="header-actions">
        <span class="nfba-version">UX v0.3</span>
        <a class="nfba-linkedin" href="https://www.linkedin.com/in/nfernandezba" target="_blank" rel="noreferrer" aria-label="LinkedIn · Nico Fernandez"><span class="linkedin-icon">in</span><span>Nico Fernandez</span></a>
      </div>
    </header>

    <main class="shelf-wall" id="library">
      <div class="library-heading"><p>Building the Center of Excellence for Power Platform</p><span>Select an item to explore the catalogue</span></div>
      <div class="shelves">
        <section class="shelf-row" aria-label="Books">
          <div class="shelf-label"><span>Books</span><small data-publication-count="book">00</small></div>
          <div class="cover-line" data-publication-shelf="book" aria-live="polite"></div>
          <div class="shelf-ledge" aria-hidden="true"></div>
        </section>

        <section class="shelf-row shelf-row--compact" aria-label="White papers">
          <div class="shelf-label"><span>White papers</span><small data-publication-count="white-paper">00</small></div>
          <div class="cover-line" data-publication-shelf="white-paper" aria-live="polite"></div>
          <div class="shelf-ledge" aria-hidden="true"></div>
        </section>

        <section class="shelf-row shelf-row--solutions" aria-label="Solutions">
          <div class="shelf-label"><span>Solutions</span><small data-publication-count="solution">00</small></div>
          <div class="cover-line" data-publication-shelf="solution" aria-live="polite"></div>
          <div class="shelf-ledge" aria-hidden="true"></div>
        </section>
      </div>
      <div class="spectrum-line" aria-hidden="true"></div>
    </main>

    <div class="dialog-backdrop" data-dialog-backdrop hidden>
      <section class="publication-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <button class="dialog-close" type="button" data-dialog-close aria-label="Close publication details">×</button>
        <div class="dialog-cover-wrap"><img data-dialog-cover src="" alt=""></div>
        <div class="dialog-content">
          <p class="dialog-kicker" data-dialog-kicker></p>
          <h2 id="dialog-title" data-dialog-title></h2>
          <p class="dialog-description" data-dialog-description></p>
          <div class="dialog-languages" data-dialog-languages aria-label="Available languages"></div>
          <div class="dialog-links" data-dialog-links></div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
